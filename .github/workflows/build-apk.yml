
name: Build OnePlus Perf Engine APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          unzip -q OnePlusPerfEngine-GitHub-Build.zip
          cd OnePlusPerfEngine
          gradle wrapper --gradle-version 8.11.1

      - name: Build APK
        working-directory: OnePlusPerfEngine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OnePlusPerfEngine-debug-apk
          path: OnePlusPerfEngine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
